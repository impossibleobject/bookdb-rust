<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bookpedia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #252525;
            font-family: Arial, sans-serif;
        }

        header {
            background: #252c35;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            padding: 30px;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        input,
        textarea {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font: inherit;
            width: 100%;
        }

        .search {
            flex: 1;
        }

        button {
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 11px 18px;
            cursor: pointer;
        }

        button:hover {
            background: #46627e;
        }

        .book-row:hover {
            background-color: #e5e7eb;
            border-radius: 4px;
        }

        .book-cover {
            width: 55px;
            height: 75px;
            object-fit: contain;
            flex-shrink: 0;
            background: #eee;
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }


        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            overflow-y: auto;
            padding: 5px;
            z-index: 10;
        }

        .modal-content {
            background: white;
            /* Change max-width to a much larger value or 'none' */
            max-width: 95%; 
            margin: 1% auto;
            padding: 3px;
            border-radius: 3px;
            /* Ensure the modal can expand horizontally */
            font-size: 12px;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }

        /* Add this to make the form take up all available space */
        #book-form {
            flex: 1; /* This tells the form to take up all available space */
            display: flex;
            flex-direction: column;
            margin: 0;
            min-width: 0;
        }

        #book-form label {
            display: block;
            margin: 0;           /* Remove all margins */
            padding: 0;          /* Remove all padding */
            font-weight: bold;
            line-height: 1.2;    /* Tighten the line height */
        }

        #book-form input, 
        #book-form textarea {
            margin: 0;           /* Remove all margins */
            padding: 4px;        /* Small padding inside the box for readability */
            display: block;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't increase width */
        }

        /* This is the container for all your inputs */
        .form-fields-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1; /* This tells the inputs to take up all space EXCEPT what the buttons need */
        }

        .modal-content label {
            display: block;
            margin: 2px 0 0px;
            font-size: 10px;
            font-weight: bold;
        }

        .modal-content textarea {
            min-height: 100px;
            max-height: 2000px;
            overflow: hidden;
            /* This allows the textarea to take up the full width of its container */
            width: 100%;
            /* Optional: if you want the text to wrap naturally */
            white-space: pre-wrap;
            word-break: break-word;
            resize: none;
            display: block;
            margin-bottom: 0;
            height: auto;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 1px solid #eee;
            flex-shrink: 0; /* Prevents the buttons from being squashed */
        }


        .form-buttons button {
            flex: 1;
        }

        .cancel {
            background: #777;
        }

        #status {
            margin: 15px 0;
            color: #666;
        }

        #bookList {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .book-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .book-cover {
            width: 55px;
            height: 75px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .book-details {
            margin-top: 5px;
            font-size: 13px;
            color: #666;
        }

        .book-authors {
            margin-top: 5px;
            font-size: 13px;
            color: #666;
        }

        .book-metadata {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
            font-size: 12px;
            color: #888;
        }

        .book-date {
            text-align: left;
        }

        .book-isbn {
            text-align: right;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 bookdb-rust</h1>
        <small>Persönliche Bibliothek</small>
    </header>

    <div class="container">

        <h2>My Library</h2>

        <div class="toolbar">
            <input id="search" class="search" placeholder="Search by title or author...">

            <button onclick="openNewBook()">
                + Add Book
            </button>
        </div>

        <div id="status">Loading books...</div>

        <div id="books"></div>

    </div>


    <!-- Book form -->
    <div id="modal" class="modal">
        <div class="modal-content">

            <!-- Use a flex container that allows the form to grow -->
            <div style="display: flex; gap: 30px; align-items: flex-start; width: 100%;">
                
                <!-- Large Cover Image -->
                <div style="flex-shrink: 0;">
                    <img id="modal-cover" src="" alt="Cover" 
                        style="width: 200px; height: 300px; object-fit: contain; border: 1px solid #ddd; border-radius: 5px; background: #eee;">
                </div>

                <!-- Form Fields Container -->
                <!-- 'flex: 1' allows this side to take up all remaining horizontal space -->
                <form id="book-form" style="flex: 1; margin: 0; min-width: 0;">
                    <div class="form-fields-container">
                        <input id="title" required style="font-size: 1.2em; font-weight: bold; outline: none;">

                        <label>Author</label>
                        <input id="author">

                        <label>Publisher</label>
                        <input id="publisher">

                        <label>Series</label>
                        <input id="series">

                        <label>Edition</label>
                        <input id="edition">

                        <label>Format</label>
                        <input id="format">

                        <label>Release Date</label>
                        <input id="release_date" type="date">

                        <label>Publishing House</label>
                        <input id="publishing_house">

                        <label>Genre</label>
                        <input id="genre">

                        <label>Pages</label>
                        <input id="pages" type="number">

                        <label>ISBN</label>
                        <input id="isbn">

                        <label>Topics</label>
                        <input id="topics">

                        <label>Comments</label>
                        <textarea id="comments"></textarea>

                        <label>Summary</label>
                        <textarea id="summary"></textarea>
                    </div>

                    <div class="form-buttons">
                        <button type="submit">Save Book</button>
                        <button type="button" class="cancel" onclick="closeModal()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>

        let editingId = null;
        let searchTimer = null;


        function autoResizeTextarea(textarea) {
            // Reset height to allow scrollHeight to be recalculated correctly
            textarea.style.height = 'auto';
            
            // Use a tiny timeout to ensure the DOM has updated the scrollHeight
            setTimeout(() => {
                textarea.style.height = textarea.scrollHeight + 'px';
            }, 0);
        }


        // Load books from PostgreSQL
        async function loadBooks() {

            const query =
                document.getElementById("search").value;

            const status =
                document.getElementById("status");

            status.textContent = "Loading...";

            try {

                const response = await fetch(
                    "/api/books?q=" + encodeURIComponent(query)
                );

                if (!response.ok) {
                    throw new Error("Could not retrieve books");
                }

                const books = await response.json();

                const container =
                    document.getElementById("books");

                container.replaceChildren();

                status.textContent =
                    books.length + " books found";

                books.forEach(book => {

                    // One horizontal row per book
                    const row = document.createElement("div");
                    row.className = "book-row";

                    // Make the entire row clickable to trigger editBook
                    row.style.cursor = "pointer";
                    row.addEventListener("click", () => editBook(book));

                    // Cover image
                    const cover = document.createElement("img");
                    cover.className = "book-cover";
                    cover.src = `../covers/${book.cover_id}.jpg`;
                    cover.alt = book.title || "Book cover";

                    cover.onerror = () => {
                        cover.removeAttribute("src");
                        cover.alt = "No cover available";
                    };



                    // Text information
                    const info = document.createElement("div");
                    info.className = "book-info";

                    // First line: title
                    const title = document.createElement("div");
                    title.className = "book-title";
                    title.textContent = book.title || "Untitled";

                    // Second line: author list
                    const authors = document.createElement("div");
                    authors.className = "book-authors";
                    authors.textContent = book.author || "Unknown author";

                    // Third line: date (left) and ISBN (right)
                    const metadata = document.createElement("div");
                    metadata.className = "book-metadata";

                    // Format YYYY-MM-DD as DD.MM.YYYY
                    const date = document.createElement("div");
                    date.className = "book-date";

                    if (book.release_date) {
                        const parts = book.release_date.substring(0, 10).split("-");
                        date.textContent = `${parts[2]}.${parts[1]}.${parts[0]}`;
                    } else {
                        date.textContent = "";
                    }

                    // ISBN, preserving its original format
                    const isbn = document.createElement("div");
                    isbn.className = "book-isbn";
                    isbn.textContent = book.isbn || "";

                    // Assemble metadata
                    metadata.append(date, isbn);

                    // Assemble text information
                    info.append(title, authors, metadata);

                    // Assemble row
                    info.append(title, authors, metadata);
                    row.append(cover, info);

                    container.appendChild(row);
                });

            } catch (error) {
                status.textContent = error.message;
            }
        }


        // Search while typing

        document.getElementById("search")
            .addEventListener("input", () => {

                clearTimeout(searchTimer);

                searchTimer = setTimeout(loadBooks, 250);
            });


        // Open empty form

        function openNewBook() {
            editingId = null;
            document.getElementById("form-title").textContent = "Add New Book";
            document.getElementById("book-form").reset();
            
            // Clear the large cover image
            const coverImg = document.getElementById("modal-cover");
            coverImg.src = "";
            coverImg.alt = "No cover";
            
            document.getElementById("modal").style.display = "block";
        }


        // Open form with existing book data

        function editBook(book) {
            editingId = book.id;

            // Update the large cover image
            const coverImg = document.getElementById("modal-cover");
            if (book.cover_id) {
                coverImg.src = `../covers/${book.cover_id}.jpg`;
                coverImg.alt = book.title || "Book cover";
            } else {
                coverImg.src = "";
                coverImg.alt = "No cover available";
            }

            document.getElementById("title").value = book.title || "";
            document.getElementById("author").value = book.author || "";
            document.getElementById("publisher").value = book.publisher || "";
            document.getElementById("series").value = book.series || "";
            document.getElementById("edition").value = book.edition || "";
            document.getElementById("format").value = book.format || "";
            document.getElementById("release_date").value = book.release_date || "";
            document.getElementById("publishing_house").value = book.publishing_house || "";
            document.getElementById("genre").value = book.genre || "";
            document.getElementById("pages").value = book.pages ?? "";
            document.getElementById("isbn").value = book.isbn || "";
            document.getElementById("topics").value = book.topics || "";
            document.getElementById("comments").value = book.comments || "";
            document.getElementById("summary").value = book.summary || "";
            // Trigger the resize for the new content
            autoResizeTextarea(document.getElementById("comments"));
            autoResizeTextarea(document.getElementById("summary"));

            document.getElementById("modal").style.display = "block";
        }



        function closeModal() {

            document.getElementById("modal").style.display =
                "none";
        }


        // Save new or modified book

        document.getElementById("book-form")
            .addEventListener("submit", async event => {
                event.preventDefault();

                const book = {
                    title: document.getElementById("title").value,
                    author: optionalValue("author"),
                    publisher: optionalValue("publisher"),
                    series: optionalValue("series"),
                    edition: optionalValue("edition"),
                    format: optionalValue("format"),
                    release_date: optionalValue("release_date"),
                    publishing_house: optionalValue("publishing_house"),
                    genre: optionalValue("genre"),
                    pages: document.getElementById("pages").value ? parseInt(document.getElementById("pages").value) : null,
                    isbn: optionalValue("isbn"),
                    topics: optionalValue("topics"),
                    comments: optionalValue("comments"),
                    summary: optionalValue("summary"),
                    date_added: null,
                    extra_fields: {}
                };
        

                const url = editingId
                    ? `/api/books/${editingId}`
                    : "/api/books";

                const method = editingId ? "PUT" : "POST";

                try {

                    const response = await fetch(url, {

                        method: method,

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(book)
                    });

                    if (!response.ok) {
                        throw new Error(
                            "Could not save book (HTTP " +
                            response.status + ")"
                        );
                    }

                    closeModal();

                    await loadBooks();

                } catch (error) {

                    alert(error.message);
                }
            });


        function optionalValue(id) {

            const value = document.getElementById(id).value.trim();

            return value === "" ? null : value;
        }


        // Initial load

        loadBooks();

    </script>

</body>

</html>
