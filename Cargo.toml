[package]
name = "bookdb-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
log = "0.4.34"
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-chrono-0_4"] }
rusqlite = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
tower-http = { version = "0.6", features = ["fs"] }